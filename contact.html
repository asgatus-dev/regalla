<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Contact Regalla for questions, support, and general inquiries">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/styleguide.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/contact.css">
<title>Contact Us | Regalla</title>
<script src="js/contact.js" defer></script>
</head>
<body>  <header>
    <nav class="navbar navbar-expand-md bg-white" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <img src="images/logo.png" alt="Regalla logo" width="45" height="48">
          <span class="brand-text"><strong>REGALLA</strong><br><small>Rule your style.</small></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
          aria-controls="main-nav" aria-expanded="false" aria-label="Open menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="main-nav">
          <ul class="navbar-nav gap-md-4">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#shop">Shop</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
<div class="contact-us">
<main>
<section class="content" aria-labelledby="contact-heading">
<h1 class="text-wrapper-4" id="contact-heading">Contact Us</h1>
<p class="apparently-we-had-re">
If you ever have a query, please contact us from any of our contacts below. We would love to hear from you.
        </p>
<div class="email-2">
<img class="email-icon" src="images/email.png" alt="" width="24" height="24">
<input
            class="hello-net"
            id="contact-email"
            name="email"
            value="hello@examplewebsite142.com"
            type="email"
            readonly
            aria-label="Contact email address"
          >
</div>
<address class="address">
<div class="element-ebert-summit-su">4074, Metro Manila</div>
<div class="lake-leonardchester">Philippines</div>
</address>
</section>
<form class="form" id="contact-form" action="#" method="post">
<div class="name">
<input
            class="text-box-bg"
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            aria-label="Name"
            required
          >
<label class="text-wrapper" for="name">Name</label>
</div>
<div class="email">
<input
            class="text-box-bg"
            id="form-email"
            name="email"
            type="email"
            autocomplete="email"
            aria-label="Email"
            required
          >
<label class="dash-net" for="form-email">Email</label>
</div>
<div class="message">
<textarea
            class="div"
            id="message"
            name="message"
            aria-label="Message"
            required
          ></textarea>
<label class="text-wrapper-2" for="message">Message</label>
</div>
<button class="button-submitt" type="submit">
<span class="bg" aria-hidden="true"></span>
<span class="text-wrapper-3">Submit</span>
</button>
</form>
<section aria-label="Regalla brand">
<img class="crown" src="images/logo.png" alt="Regalla crown">
<div class="text-wrapper-8">REGALLA</div>
<p class="text-wrapper-9">Rule your style.</p>
</section>
</main>
</div>  <footer class="site-footer py-3">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <p class="mb-0">© 2026 Regalla</p>
      <p class="mb-0"><a href="privacy-policy.html">Privacy Policy</a> | <a href="terms-and-conditions.html">Terms &amp; Conditions</a></p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
