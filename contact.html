<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Contact Regalla for questions, support, and general inquiries">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/globals.css">
<link rel="stylesheet" href="css/styleguide.css">
<link rel="stylesheet" href="css/contact.css">
<title>Contact Us | Regalla</title>
<script src="js/contact.js" defer></script>
</head>
<body>
<div class="contact-us">
<header class="site-header">
<a class="brand" href="index.html" aria-label="Regalla home">
<svg class="brand__logo" viewBox="0 0 48 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
<path d="M5 28 L2 8 L14 17 L24 4 L34 17 L46 8 L43 28 Z"/>
<circle cx="2" cy="7" r="2" fill="#fff"/>
<circle cx="24" cy="3.5" r="2" fill="#fff"/>
<circle cx="46" cy="7" r="2" fill="#fff"/>
<path d="M6 32 H42" stroke-dasharray="1.5 2"/>
</svg>
<span class="brand__text">
<span class="brand__name">REGALLA</span>
<span class="brand__tagline">Rule your style.</span>
</span>
</a>
<nav class="site-nav" aria-label="Main">
<a href="index.html">Home</a>
<a href="index.html#shop">Shop</a>
<a href="index.html#about">About</a>
<a href="contact.html" aria-current="page">Contact</a>
</nav>
</header>
<main>
<section class="content" aria-labelledby="contact-heading">
<h1 class="text-wrapper-4" id="contact-heading">Contact Us</h1>
<p class="apparently-we-had-re">
If you ever have a query, please contact us from any of our contacts below. We would love to hear from you.
        </p>
<div class="email-2">
<img class="email-icon" src="images/email.png" alt="" width="24" height="24">
<input
            class="hello-net"
            id="contact-email"
            name="email"
            value="regallatees@gmail.com"
            type="email"
            readonly
            aria-label="Contact email address"
          >
</div>
<address class="address">
<div class="element-ebert-summit-su">4074, Metro Manila</div>
<div class="lake-leonardchester">Philippines</div>
</address>
</section>
<form class="form" id="contact-form" action="#" method="post">
<div class="name">
<input
            class="text-box-bg"
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            aria-label="Name"
            required
          >
<label class="text-wrapper" for="name">Name</label>
</div>
<div class="email">
<input
            class="text-box-bg"
            id="form-email"
            name="email"
            type="email"
            autocomplete="email"
            aria-label="Email"
            required
          >
<label class="dash-net" for="form-email">Email</label>
</div>
<div class="message">
<textarea
            class="div"
            id="message"
            name="message"
            aria-label="Message"
            required
          ></textarea>
<label class="text-wrapper-2" for="message">Message</label>
</div>
<button class="button-submitt" type="submit">
<span class="bg" aria-hidden="true"></span>
<span class="text-wrapper-3">Submit</span>
</button>
</form>
<section aria-label="Regalla brand">
<img class="crown" src="images/logo.png" alt="Regalla crown">
<div class="text-wrapper-8">REGALLA</div>
<p class="text-wrapper-9">Rule your style.</p>
</section>
</main>
<footer>
<div class="rectangle-2" aria-hidden="true"></div>
<p class="element-regalla-2">© 2026 Regalla</p>
<nav aria-label="Footer navigation">
<a class="text-wrapper-7" href="privacy-policy.html">Privacy Policy</a>
<a class="terms-conditions-2" href="terms.html">Terms &amp; Conditions</a>
</nav>
</footer>
</div>
</body>
</html>
